name: covid-platform

services:
  api:
    build:
      context: .
      dockerfile: dockerfile

    container_name: covid_api

    env_file:
      - .env

    environment:
      MONGODB_URI: >-
        mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      REDIS_URL: redis://redis:6379/0
      SNOWFLAKE_API_ROLE: COVID_APP_ROLE
      SNOWFLAKE_API_SCHEMA: MARTS
      COVID_DATASET: ${COVID_DATASET:-extended}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-covid-api:v4}
      SERVICE_NAME: covid-api

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dockerfile

    container_name: covid_dashboard

    environment:
      DASHBOARD_API_BASE_URL: http://api:8000
      DASHBOARD_PUBLIC_API_BASE_URL: http://localhost:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: covid-dashboard

    command:
      - python
      - -m
      - app.dashboard.app

    ports:
      - "8050:8050"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8050', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  mongo:
    image: mongo:7.0

    container_name: covid_mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  redis:
    image: redis:7.4-alpine

    container_name: covid_redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  spark:
    profiles:
      - spark

    build:
      context: .
      dockerfile: dockerfile.spark

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPARK_LOCAL_IP: 127.0.0.1

    entrypoint:
      - python
      - -m
      - scripts.run_spark_bronze

    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./spark_tests:/app/spark_tests:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./reports/spark:/app/reports/spark

    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  mongo_data:
  redis_data:
