name: Python code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: isort, Black, and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Verify lockfile
        run: uv lock --check

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Check import ordering
        run: uv run isort --check-only --diff .

      - name: Check formatting
        run: uv run black --check --diff .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  spark:
    name: PySpark fixture pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Synchronize Spark environment
        run: uv sync --locked --group spark

      - name: Run Spark fixture tests
        run: uv run --group spark python -m unittest discover -s spark_tests -v
